<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="badge">Безопасность</div>
        <h1>Смените пароль</h1>
        <p class="muted">Для входа использовался временный пароль. Задайте новый пароль и подтверждение.</p>
        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}
        <form method="post" action="/change-password" class="stack-form">
            <label>
                <span>Новый пароль</span>
                <input type="password" name="password" required>
            </label>
            <label>
                <span>Подтверждение пароля</span>
                <input type="password" name="password_confirm" required>
            </label>
            <button type="submit">Сохранить новый пароль</button>
        </form>
    </div>
</body>
</html>
